version: '3.8'

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: app-nginx-proxy-1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - dhparam:/etc/nginx/dhparam
      - certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: app-acme-companion-1
    volumes_from:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro

  frontend:
    build:
      context: ./frontend
    container_name: app-web-1
    environment:
      - VIRTUAL_HOST=stackalg.tech
      - LETSENCRYPT_HOST=stackalg.tech

  backend:
    build:
      context: .
      dockerfile: MyApi/Dockerfile
    container_name: app-api-1
    environment:
      - ASPNETCORE_URLS=http://+:8080

volumes:
  conf:
  vhost:
  html:
  dhparam:
  certs:
  acme: